<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- relative paths: the same build runs at a domain root, under a sub-path (GitHub Pages) and inside the desktop app -->
    <link rel="icon" type="image/x-icon" href="./icon.ico" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RemedacareHMS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RemedacareHMS</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-text-size-adjust: 100%; }
      /* The page itself never moves (no whole-page bounce or sideways drag on iPhone, top bar stays put):
         it is exactly the visible screen, and only the app's own areas scroll inside it. */
      html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--color-bg-alt, #F7F8F7); }
      body { position: fixed; inset: 0; width: 100%; }
      #root { height: 100%; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
        /* iPhone home-screen app: keep content clear of the notch and the home bar */
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
      /* iPhone Safari zooms into any field under 16px when tapped; on small screens fields use 16px */
      @media (max-width: 820px) and (pointer: coarse) {
        input, select, textarea { font-size: 16px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
