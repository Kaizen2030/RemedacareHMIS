<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- relative paths: the same build runs at a domain root, under a sub-path (GitHub Pages) and inside the desktop app -->
    <link rel="icon" type="image/x-icon" href="./icon.ico" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RemedacareHMS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RemedacareHMS</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-text-size-adjust: 100%; }
      /* iPhone home-screen app: keep content clear of the notch and the home bar */
      @supports (padding: env(safe-area-inset-top)) {
        body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
      }
      /* iPhone Safari zooms into any field under 16px when tapped; on small screens fields use 16px */
      @media (max-width: 820px) and (pointer: coarse) {
        input, select, textarea { font-size: 16px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
